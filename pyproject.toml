[project]
name = "sashimi"
version = "0.1.0"
description = "Thinly sliced Poisson: an MCP-native wrapper around APBS for biomolecular electrostatics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0",
    "numpy>=2.0",
    # Structure preparation. Pure Python, so PyPI is the whole story here —
    # unlike APBS, which uv cannot install and which comes from the system
    # package manager. See README "Install".
    "pdb2pqr==3.7.1",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
]

[project.scripts]
sashimi = "sashimi.cli:main"
# stdio entry point, for registering alongside the rest of the FastMCP fleet.
sashimi-mcp = "sashimi.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sashimi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "apbs: requires the APBS binary (deselect with '-m \"not apbs\"')",
]
# The MCP tests drive a real client session, which is async throughout.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Ruff formats Python blocks inside Markdown. ROADMAP.md's snippets are
# illustrative and column-aligned for reading, not code to be normalized.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "A",     # shadowed builtins
    "ARG",   # unused arguments
    "B",     # bugbear
    "C4",    # comprehensions
    "DTZ",   # naive datetimes
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FURB",  # modernization
    "I",     # import sorting
    "ISC",   # implicit string concat
    "N",     # pep8 naming
    "NPY",   # numpy-specific
    "PERF",  # obvious performance traps
    "PIE",   # misc lints
    "PL",    # pylint
    "PTH",   # use pathlib
    "RET",   # return simplification
    "RUF",   # ruff-specific
    "SIM",   # simplification
    "T20",   # no stray print()
    "TID",   # tidy imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    # solve_lpbe's parameters are the API; collapsing them into a config object
    # is exactly what ROADMAP.md section 6 rejects as harder for agents to call.
    "PLR0913",
    # ROADMAP.md section 4.2 names these exceptions: GridTooLarge, ConvergenceFailure,
    # ApbsNotFound, ApbsCrash. They are the documented contract, so an -Error
    # suffix would put the linter ahead of the spec.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# A command-line entry point exists to write to stdout; T201 is there to catch
# stray debug prints in library code, which is everything else.
"src/sashimi/cli.py" = ["T201"]
"tests/**" = [
    "PLR2004", # magic numbers are the point of a test
    "ARG001",  # pytest fixtures arrive as unused-looking arguments
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["sashimi", "tests"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[[tool.mypy.overrides]]
# Test functions are discovered by name, not called by typed code, so requiring
# `-> None` on every one of them buys no safety — their bodies are still checked.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
