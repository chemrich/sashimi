[project]
name = "sashimi-electro"
version = "0.1.0"
description = "Thinly sliced Poisson: an MCP-native wrapper around APBS for biomolecular electrostatics"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "chemrich", email = "emrich@gmail.com" }]
keywords = [
    "poisson-boltzmann",
    "electrostatics",
    "apbs",
    "structural-biology",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]

dependencies = [
    "fastmcp>=3.4.7",
    "numpy>=2.0",
    # Structure preparation. Pure Python, so PyPI is the whole story here —
    # unlike APBS, which uv cannot install and which comes from the system
    # package manager. See README "Install".
    "pdb2pqr==3.7.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The compiled surface kernel. Deliberately an extra rather than a dependency:
# numba brings llvmlite and the two are ~145 MB installed, against a package
# whose proposition is that it installs anywhere with nothing to fetch by hand.
# It makes the debye backend's surface geometry 9-116x faster loop by loop, which
# is ~3.4x on a whole solve, so anyone doing protein electrostatics with `debye`
# wants it — see README "A faster debye" and `sashimi_capabilities`.
fast = ["numba>=0.61"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
]

[project.urls]
Homepage = "https://github.com/chemrich/sashimi"
Repository = "https://github.com/chemrich/sashimi"
Changelog = "https://github.com/chemrich/sashimi/blob/main/CHANGELOG.md"

[project.scripts]
sashimi = "sashimi.cli:main"
# stdio entry point, for registering alongside the rest of the FastMCP fleet.
sashimi-mcp = "sashimi.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sashimi"]

# An allowlist, not an exclude list. hatchling otherwise ships whatever happens
# to be in the working directory: the first `uv build` of this project produced
# a 48.9 MB sdist carrying the `.pydelphi/` virtual environment, which then
# failed to unpack because it contains absolute symlinks into somebody's home
# directory. An exclude list would have to anticipate the next such directory.
#
# `tests/` is in deliberately. The corpus is what stands in for a version pin on
# a compiled backend (§7), so a downstream packager needs it to verify a build
# rather than trust one.
[tool.hatch.build.targets.sdist]
# Leading slashes anchor to the root. Without them a bare `README.md` is a
# glob at any depth, and `studies/README.md` shipped by accident.
include = [
    "/src/sashimi",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/ROADMAP.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = [
    "**/__pycache__",
    # Solve artifacts; the same reason .gitignore names them.
    "tests/data/potential-*.dx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "apbs: requires the APBS binary (deselect with '-m \"not apbs\"')",
    "delphi: requires a DelPhi executable (deselect with '-m \"not delphi\"')",
    "tabipb: requires TABI-PB and its NanoShaper mesher (deselect with '-m \"not tabipb\"')",
]
# The MCP tests drive a real client session, which is async throughout.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Ruff formats Python blocks inside Markdown. ROADMAP.md's snippets are
# illustrative and column-aligned for reading, not code to be normalized.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "A",     # shadowed builtins
    "ARG",   # unused arguments
    "B",     # bugbear
    "C4",    # comprehensions
    "DTZ",   # naive datetimes
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FURB",  # modernization
    "I",     # import sorting
    "ISC",   # implicit string concat
    "N",     # pep8 naming
    "NPY",   # numpy-specific
    "PERF",  # obvious performance traps
    "PIE",   # misc lints
    "PL",    # pylint
    "PTH",   # use pathlib
    "RET",   # return simplification
    "RUF",   # ruff-specific
    "SIM",   # simplification
    "T20",   # no stray print()
    "TID",   # tidy imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    # solve_lpbe's parameters are the API; collapsing them into a config object
    # is exactly what ROADMAP.md section 6 rejects as harder for agents to call.
    "PLR0913",
    # ROADMAP.md section 4.2 names these exceptions: GridTooLarge, ConvergenceFailure,
    # ApbsNotFound, ApbsCrash. They are the documented contract, so an -Error
    # suffix would put the linter ahead of the spec.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# A command-line entry point exists to write to stdout; T201 is there to catch
# stray debug prints in library code, which is everything else.
"src/sashimi/cli.py" = ["T201"]
"tests/**" = [
    "PLR2004", # magic numbers are the point of a test
    "ARG001",  # pytest fixtures arrive as unused-looking arguments
]
# `studies/` holds the measurement scripts behind ROADMAP.md section 12's tables.
# They are run by hand and read as a record of how a number was produced, so they
# print, they hard-code the configuration each table was taken at, and they are
# not imported by anything. Linting them as library code would mean rewriting the
# artefact to suit the linter, which is the opposite of what checking them in is
# for. They are still formatted and still type-clean at the syntax level.
"studies/**" = [
    "T201",    # a study script exists to write a table to stdout
    "PLR2004", # the configuration is the point, and naming every rung hides it
    "PTH123",  # `open` is what these were run with
    "INP001",  # deliberately not a package
    "SIM115",  # a script that writes one table does not need a context manager
    "B905",    # `zip` without `strict` is how these were run
    "N802",    # a few carry the mathematical name of the thing they compute
    "N803",
    "N806",
    "N812",
    "C408",
    "UP031",
    "PLR0912", # one sweep genuinely has that many branches
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["sashimi", "tests"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[[tool.mypy.overrides]]
# numba is an optional extra, so the default development environment does not
# have it and never should — the pure-numpy path is the one most contributors
# run. Its absence is the normal case, not a missing stub to chase.
module = ["numba.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test functions are discovered by name, not called by typed code, so requiring
# `-> None` on every one of them buys no safety — their bodies are still checked.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
