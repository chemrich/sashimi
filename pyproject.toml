[project]
name = "sashimi"
version = "0.1.0"
description = "Thinly sliced Poisson: an MCP-native wrapper around APBS for biomolecular electrostatics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sashimi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "apbs: requires the APBS binary (deselect with '-m \"not apbs\"')",
]
