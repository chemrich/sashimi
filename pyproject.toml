[project]
name = "sashimi"
version = "0.1.0"
description = "Thinly sliced Poisson: an MCP-native wrapper around APBS for biomolecular electrostatics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sashimi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "apbs: requires the APBS binary (deselect with '-m \"not apbs\"')",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Ruff formats Python blocks inside Markdown. PLAN.md's snippets are
# illustrative and column-aligned for reading, not code to be normalized.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "A",     # shadowed builtins
    "ARG",   # unused arguments
    "B",     # bugbear
    "C4",    # comprehensions
    "DTZ",   # naive datetimes
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FURB",  # modernization
    "I",     # import sorting
    "ISC",   # implicit string concat
    "N",     # pep8 naming
    "NPY",   # numpy-specific
    "PERF",  # obvious performance traps
    "PIE",   # misc lints
    "PL",    # pylint
    "PTH",   # use pathlib
    "RET",   # return simplification
    "RUF",   # ruff-specific
    "SIM",   # simplification
    "T20",   # no stray print()
    "TID",   # tidy imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    # solve_lpbe's parameters are the API; collapsing them into a config object
    # is exactly what section 6 rejects for being harder for agents to call.
    "PLR0913",
    # PLAN.md section 5 names these exceptions: GridTooLarge, ConvergenceFailure,
    # ApbsNotFound, ApbsCrash. They are the documented contract, so an -Error
    # suffix would put the linter ahead of the spec.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004", # magic numbers are the point of a test
    "ARG001",  # pytest fixtures arrive as unused-looking arguments
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["sashimi"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[[tool.mypy.overrides]]
# Test functions are discovered by name, not called by typed code, so requiring
# `-> None` on every one of them buys no safety — their bodies are still checked.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
