name: CI

on:
  push:
    branches: [main]
  pull_request:
  # osx-arm64 costs 10x per minute, and a pull request iterates. So the macOS
  # leg runs where it is worth that: on main after a merge, weekly against a
  # moving conda-forge, and on demand. See "Which runners, and why" below.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete. main is
# excluded so pushes there always produce a complete, citable result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Which runners, and why.
      #
      # `full` carries every backend this project can install. `none` carries
      # nothing at all — the machine a fresh checkout runs on, and the one
      # `sashimi.gb` exists for, since it is the only backend that cannot be
      # missing. It is also the configuration protean's fallback path runs in,
      # and until 2026-08-13 a bare checkout failed 56 tests because a marker
      # selects but does not skip. `apbs-only` is
      # the README's own recommended install and nothing else, which is what
      # most users and contributors will actually have — and it is the leg that
      # catches the failure mode this project keeps hitting: a test that needs a
      # binary without saying so. A marker selects and deselects; it does not
      # skip. Two such bugs were found the day this leg was added, one of them
      # five tests failing on the documented install since phase 7.
      #
      # linux-64 is the lab target. macos-latest is arm64, which ROADMAP.md
      # phase 0 established as a first-class platform rather than a Rosetta
      # fallback — but GitHub bills it at 10x, and at ~6 minutes a run it was
      # roughly 90% of this project's CI spend and exhausted the account's
      # Actions budget mid-day on 2026-08-12. It now runs on main, weekly and on
      # demand rather than on every pull-request push. What it uniquely proves —
      # that conda-forge ships a working osx-arm64 APBS 3.4.1 — is a fact about
      # a third party that changes rarely, and every commit is exercised on
      # osx-arm64 locally before it is pushed.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","profile":"full"},{"os":"ubuntu-latest","profile":"apbs-only"},{"os":"ubuntu-latest","profile":"none"}]' || '[{"os":"ubuntu-latest","profile":"full"},{"os":"ubuntu-latest","profile":"apbs-only"},{"os":"ubuntu-latest","profile":"none"},{"os":"macos-latest","profile":"full"}]') }}
    steps:
      - uses: actions/checkout@v7

      # APBS is a compiled binary, so no Python installer can provide it, and
      # micromamba is here for exactly one job: fetching it. It manages nothing
      # Python — uv owns all of that below.
      #
      # conda-forge rather than the system package managers, deliberately. The
      # alternatives work but neither is well-governed: macOS APBS lives only in
      # the third-party brewsci/bio tap (Homebrew refuses to load it without an
      # explicit trust step), and Debian's build differs from it in observable
      # ways. conda-forge carries the same 3.4.1 for linux-64 and osx-arm64 from
      # one channel with a public recipe, which is what CI should be testing.
      - uses: mamba-org/setup-micromamba@v3.2.1
        if: matrix.profile != 'none'
        with:
          environment-name: apbs
          create-args: apbs=3.4.1
          condarc: |
            channels:
              - conda-forge
          cache-environment: true

      - name: Point sashimi at the conda-forge APBS
        if: matrix.profile != 'none'
        shell: bash -el {0}
        run: |
          apbs_bin="$(micromamba run -n apbs which apbs)"
          echo "SASHIMI_APBS_PATH=$apbs_bin" >> "$GITHUB_ENV"
          # In a temp dir: every APBS invocation drops an io.mc log in cwd.
          (cd "$(mktemp -d)" && "$apbs_bin" --version 2>&1 | head -3)

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # DelPhi: the C++ reference build on Linux, pyDelPhi on macOS.
      #
      # Both flavours on the `full` profile, because they differ in ways that
      # produce wrong answers rather than errors: `temper` is Celsius in the C++
      # build and kelvin in pyDelPhi, and their surface-model support differs.
      #
      # They used to be split one per runner, on the belief that pyDelPhi
      # "supports neither shared surface model and so can validate nothing".
      # That was the `surfmethod=vdw` misreading phase 7 corrected — it names
      # the probe-rolling construction, not a van der Waals boundary, and
      # reproduces the C++ build's `molecular` answer exactly. Both flavours can
      # cross-validate, so both are installed and both are exercised; the split
      # would have quietly dropped pyDelPhi to weekly when macOS came off the
      # per-push path.
      #
      # Both are driven as subprocesses and never imported: DelPhi ships no
      # licence text at all and pyDelPhi is AGPL-3.0 where sashimi is MIT, which
      # is the boundary ROADMAP.md section 9 already draws around APBS.

      - name: Cache the DelPhi build
        if: runner.os == 'Linux' && matrix.profile == 'full'
        id: delphi-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/delphi
          # Bump the trailing version to force a rebuild; the digest is the
          # upstream tarball's, so a silently re-cut release also invalidates it.
          key: delphi-cpp-8.5.0-51f3e2ac-${{ runner.os }}-v1

      # Measured at 40 s under emulation on Ubuntu 24.04 (g++ 13.3, boost 1.83)
      # and ~13 s natively, so the cache is a convenience rather than a
      # necessity. Only boost *headers* are needed; nothing is linked.
      #
      # CXXFLAGS is overridden to drop the upstream `-march=native`, which would
      # otherwise tune the link line to whichever runner built it. Allowed to
      # fail: if Clemson's host is down, the DelPhi tests should skip rather
      # than turn sashimi's CI red.
      - name: Build DelPhi (C++ reference build)
        id: delphi_cpp
        if: runner.os == 'Linux' && matrix.profile == 'full' && steps.delphi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev
          curl -sSLO https://compbio.clemson.edu/lab/media/releasefiles/Delphicpp_v8.5.0_Linux.tar.gz
          echo "51f3e2acceac1730a0dc72562300f3dc072f968b557e6bc25148013ab578cedf  Delphicpp_v8.5.0_Linux.tar.gz" \
            | sha256sum -c -
          tar xzf Delphicpp_v8.5.0_Linux.tar.gz
          make -C Delphicpp_v8.5.0_Linux/Release -j"$(nproc)" CXXFLAGS='-O2 -w -std=c++11 -DNDEBUG'
          mkdir -p ~/.local/delphi
          cp Delphicpp_v8.5.0_Linux/Release/delphicpp_release ~/.local/delphi/

      # Pinned to the v0.3.0 tag on the author's repository, which is the one
      # pyDelPhi's own pyproject names. The delphi001 org copy is a stale mirror
      # (v0.2.0, last pushed 2025-11) with issues disabled.
      - name: Install pyDelPhi
        id: pydelphi
        if: matrix.profile == 'full'
        continue-on-error: true
        run: |
          uv venv --python 3.13 .pydelphi
          uv pip install --python .pydelphi/bin/python \
            "pydelphi @ git+https://github.com/shaileshp51/pyDelPhi@e8531243b9537c6996a477004131e808c773340a"
          # `--version` prints the version and then exits 1. Without the `|| true`
          # this step "fails", the env var below never gets set, and the DelPhi
          # tests skip while the run stays green — which is exactly how this was
          # missed the first time. `discover.py` tolerates the same exit code.
          .pydelphi/bin/pydelphi-static --version || true

      # TABI-PB, the boundary-element backend. Linux only, for the same reason
      # the DelPhi build is: the NanoShaper triangulator its build fetches is
      # x86_64, which is native on ubuntu-latest and needs Rosetta on the arm64
      # macOS runner. Without this the eleven `tabipb`-marked tests skip, and a
      # skipped tier looks exactly like a passing one.
      #
      # BSD-3-Clause and CMake, so this is a much smaller ceremony than DelPhi:
      # the build fetches its own mesher. Pinned to a commit because TABI-PB
      # publishes no release tarball, and allowed to fail so a third party's
      # outage skips the tier rather than reddening CI.
      - name: Cache the TABI-PB build
        if: runner.os == 'Linux' && matrix.profile == 'full'
        id: tabipb-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/tabipb
          key: tabipb-970c98d4-${{ runner.os }}-v1

      - name: Build TABI-PB
        id: tabipb
        if: runner.os == 'Linux' && matrix.profile == 'full' && steps.tabipb-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Treecodes/TABI-PB.git tabipb-src
          git -C tabipb-src checkout -q 970c98d4080903caf1b8999c6135fe5e726a2b4a
          cmake -S tabipb-src -B tabipb-build -DGET_NanoShaper=ON -DCMAKE_BUILD_TYPE=Release
          make -C tabipb-build -j"$(nproc)"
          mkdir -p ~/.local/tabipb
          # NanoShaper must sit beside the solver: `tabipb` invokes it by bare
          # name through a shell. It also arrives without the execute bit.
          install -m 0755 tabipb-build/bin/tabipb ~/.local/tabipb/tabipb
          install -m 0755 tabipb-build/bin/NanoShaper ~/.local/tabipb/NanoShaper

      - name: Point sashimi at TABI-PB
        id: tabipb_path
        run: |
          if [ -x "$HOME/.local/tabipb/tabipb" ]; then
            echo "SASHIMI_TABIPB_PATH=$HOME/.local/tabipb/tabipb" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No TABI-PB available; its tests will skip."
          fi

      - name: Point sashimi at DelPhi
        id: delphi_path
        run: |
          if [ -x "$HOME/.local/delphi/delphicpp_release" ]; then
            found="$HOME/.local/delphi/delphicpp_release"
          elif [ -x "$PWD/.pydelphi/bin/pydelphi-static" ]; then
            found="$PWD/.pydelphi/bin/pydelphi-static"
          else
            echo "No DelPhi available; its tests will skip." && exit 0
          fi
          echo "SASHIMI_DELPHI_PATH=$found" >> "$GITHUB_ENV"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Install
        # --frozen: fail if uv.lock is out of date with pyproject.toml, rather
        # than silently resolving something different from what runs locally.
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen mypy

      - name: Test
        run: uv run --frozen pytest -q

      # Guards the failure this workflow shipped with on its first run: pyDelPhi
      # installed, the env var silently never got set, all eight DelPhi tests
      # skipped, and CI stayed green. A skipped tier and a passing tier look
      # identical in the summary line, so assert the distinction whenever a
      # DelPhi was actually found.
      - name: Verify the DelPhi tier actually ran
        if: steps.delphi_path.outputs.found == 'true'
        run: uv run --frozen pytest -q -m delphi

      # Discovery prefers the C++ build where both exist, so without this the
      # pure-Python flavour would be installed and never run — a skipped tier
      # and a passing tier look identical, which is the trap this workflow was
      # already burned by once.
      - name: Verify the pyDelPhi flavour actually ran
        if: runner.os == 'Linux' && steps.pydelphi.outcome == 'success'
        env:
          SASHIMI_DELPHI_PATH: ${{ github.workspace }}/.pydelphi/bin/pydelphi-static
        run: uv run --frozen pytest -q -m delphi

      - name: Verify the TABI-PB tier actually ran
        if: steps.tabipb_path.outputs.found == 'true'
        run: uv run --frozen pytest -q -m tabipb

      # `pytest` verifies the fast tier so the local edit-test loop stays a
      # loop; the standard tier is ~90 s of solving and runs here instead. Its
      # own step on purpose: a corpus diff is a real result change, and it
      # should read as one rather than as one failure among four hundred tests.
      # `full` is not run per push — `sashimi corpus verify --tier full`.
      # Needs APBS and nothing else, so running it on both Linux legs would pay
      # twice for the same numbers.
      - name: Verify the corpus (standard tier)
        if: matrix.profile == 'full'
        run: uv run --frozen sashimi corpus verify --tier standard

  # Single stable check name for the branch ruleset to require. Matrix job names
  # change whenever the matrix does; this one does not.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check job result: ${{ needs.check.result }}"
            exit 1
          fi
          echo "all checks passed"
