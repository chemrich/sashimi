name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete. main is
# excluded so pushes there always produce a complete, citable result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux-64 is the lab target; macos-latest is arm64, which ROADMAP.md phase 0
        # established as a first-class platform rather than a Rosetta fallback.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # APBS is a compiled binary, so no Python installer can provide it, and
      # micromamba is here for exactly one job: fetching it. It manages nothing
      # Python — uv owns all of that below.
      #
      # conda-forge rather than the system package managers, deliberately. The
      # alternatives work but neither is well-governed: macOS APBS lives only in
      # the third-party brewsci/bio tap (Homebrew refuses to load it without an
      # explicit trust step), and Debian's build differs from it in observable
      # ways. conda-forge carries the same 3.4.1 for linux-64 and osx-arm64 from
      # one channel with a public recipe, which is what CI should be testing.
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: apbs
          create-args: apbs=3.4.1
          condarc: |
            channels:
              - conda-forge
          cache-environment: true

      - name: Point sashimi at the conda-forge APBS
        shell: bash -el {0}
        run: |
          apbs_bin="$(micromamba run -n apbs which apbs)"
          echo "SASHIMI_APBS_PATH=$apbs_bin" >> "$GITHUB_ENV"
          # In a temp dir: every APBS invocation drops an io.mc log in cwd.
          (cd "$(mktemp -d)" && "$apbs_bin" --version 2>&1 | head -3)

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # DelPhi, in the only form CI can have it. The C++ reference build has to
      # be compiled from a Clemson tarball with boost and a makefile that
      # hardcodes x86 flags, so no CI job installs it; pyDelPhi is the same lab's
      # Python/numba reimplementation and needs nothing but a Python.
      #
      # In its own virtualenv, for three separate reasons, any one of which
      # would be sufficient: it pins numpy<2.3 and python<3.13 against sashimi's
      # own resolution, and it is AGPL-3.0 where sashimi is MIT — so it is
      # driven as a subprocess and never imported, which is the boundary
      # ROADMAP.md section 9 already draws around APBS.
      #
      # Pinned to a commit because pyDelPhi has no release on PyPI, and allowed
      # to fail: if a third party's git host is down, the DelPhi tests should
      # skip rather than turn sashimi's CI red.
      - name: Install pyDelPhi
        id: pydelphi
        continue-on-error: true
        run: |
          uv venv --python 3.12 .pydelphi
          uv pip install --python .pydelphi/bin/python \
            "pydelphi @ git+https://github.com/delphi001/pyDelPhi@ebc84cb0c7951274cf76cf0b00185f07999527a5"
          # `--version` prints the version and then exits 1. Without the `|| true`
          # this step "fails", the env var below never gets set, and the DelPhi
          # tests skip while the run stays green — which is exactly how this was
          # missed the first time. `discover.py` tolerates the same exit code.
          .pydelphi/bin/pydelphi-static --version || true

      - name: Point sashimi at pyDelPhi
        if: steps.pydelphi.outcome == 'success'
        run: echo "SASHIMI_DELPHI_PATH=$PWD/.pydelphi/bin/pydelphi-static" >> "$GITHUB_ENV"

      - name: Install
        # --frozen: fail if uv.lock is out of date with pyproject.toml, rather
        # than silently resolving something different from what runs locally.
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen mypy

      - name: Test
        run: uv run --frozen pytest -q

      # Guards the failure this workflow shipped with on its first run: pyDelPhi
      # installed, the env var silently never got set, all eight DelPhi tests
      # skipped, and CI stayed green. A skipped tier and a passing tier look
      # identical in the summary line, so assert the distinction.
      - name: Verify the DelPhi tier actually ran
        if: steps.pydelphi.outcome == 'success'
        run: |
          test -n "$SASHIMI_DELPHI_PATH"
          uv run --frozen pytest -q -m delphi

  # Single stable check name for the branch ruleset to require. Matrix job names
  # change whenever the matrix does; this one does not.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check job result: ${{ needs.check.result }}"
            exit 1
          fi
          echo "all checks passed"
