version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all action bumps rather than four — they are near-always
      # safe and reviewing them individually is pure overhead.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # `uv`, not `pip`. The uv ecosystem updates pyproject.toml and uv.lock in the
  # same commit; the pip ecosystem edits only the manifest, which desyncs the
  # lockfile and fails CI's `--frozen` check. That is what happened under pixi
  # in PR #1, and it is not a pixi-specific trap.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

# Not covered: APBS. It is a compiled binary from the system package manager
# (brew / apt), which no Dependabot ecosystem tracks. tests/test_corpus.py is
# the guard there — it asserts the version and re-checks the Born energies, so
# a drifted build fails loudly rather than quietly changing results.
