# Note the coverage gap: Dependabot has no pixi ecosystem, so nothing here
# updates pixi.toml or pixi.lock — apbs, pdb2pqr, ruff, mypy and pytest are all
# pinned there and stay manual (`pixi update`). APBS 3.4.1 is deliberately
# frozen anyway; the dev tools are the ones worth refreshing periodically.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all action bumps rather than four — they are near-always
      # safe and reviewing them individually is pure overhead.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # No pip ecosystem here, deliberately. pixi installs this package from
  # pyproject.toml as an editable path dependency, so pyproject's constraints
  # are baked into pixi.lock. Dependabot edits pyproject.toml and cannot
  # regenerate the lockfile, which desyncs the two and fails CI's `--locked`
  # check on every such PR. Proven the hard way by PR #1. Python dependencies
  # are updated with `pixi update` instead.
