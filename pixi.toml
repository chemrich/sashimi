[workspace]
name = "sashimi"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.13.*"
# Frozen solver backend. Never vendored, never built from source.
apbs = "==3.4.1"
numpy = ">=2.0"

[pypi-dependencies]
# conda-forge tops out at 3.6.1; 3.7.1 is PyPI-only.
pdb2pqr = "==3.7.1"
sashimi = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.14"
mypy = ">=1.18"
pre-commit = ">=4.0"

[environments]
default = { features = ["dev"] }

[tasks]
test = "pytest"
test-fast = "pytest -m 'not apbs'"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src tests"
# What CI runs, and what pre-commit approximates locally.
check = { depends-on = ["lint", "typecheck", "test"] }
